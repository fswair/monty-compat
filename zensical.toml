[project]
site_name = "monty-compat"
site_url = "https://fswair.github.io/monty-compat/"
site_description = "Release-aware Python source transpilation for Monty"
site_author = "Mert"
repo_url = "https://github.com/fswair/monty-compat"
repo_name = "fswair/monty-compat"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed · built for explicit compatibility"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  {"Overview" = "index.md"},
  {"Python API" = "python-api.md"},
  {"Release selection" = "releases.md"},
  {"Lowering" = "lowering.md"},
  {"Discovery" = "discovery.md"},
  {"Rust API" = "rust-api.md"},
  {"Benchmarks" = "benchmarks.md"},
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "content.action.view",
  "content.code.copy",
]

[project.theme.font]
text = "Manrope"
code = "IBM Plex Mono"

[project.theme.icon]
logo = "lucide/blocks"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Use dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Use system preference"
