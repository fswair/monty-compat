[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "monty-compat"
version = "0.5.0"
description = "Release-aware Python source transpiler and capability discovery for Monty"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mert", email = "contact@tomris.dev"},
]
keywords = ["monty", "pydantic-monty", "sandbox", "compatibility", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.scripts]
monty-compat-discover = "monty_compat.discovery:main"

[project.optional-dependencies]
discovery = [
    "pydantic-monty",
    "pysource-codegen==0.7.1",
    "pysource-minimize==0.10.1",
]
dev = [
    "mypy>=1.11",
    "pytest>=7.0",
    "pydantic-monty",
    "pysource-codegen==0.7.1",
    "pysource-minimize==0.10.1",
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/fswair/monty-compat"
Repository = "https://github.com/fswair/monty-compat"

[tool.maturin]
manifest-path = "crates/monty-compat-python/Cargo.toml"
module-name = "monty_compat._native"
python-source = "src"
bindings = "pyo3"
include = [
    {path = "LICENSE", format = "sdist"},
    {path = "CHANGELOG.md", format = "sdist"},
    {path = "manifests/*.json", format = "sdist"},
    {path = "docs/*.md", format = "sdist"},
    {path = "docs/stylesheets/*.css", format = "sdist"},
    {path = "examples/README.md", format = "sdist"},
    {path = "examples/**/*.py", format = "sdist"},
    {path = "zensical.toml", format = "sdist"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
