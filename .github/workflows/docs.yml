name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "manifests/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Build Zensical site
        run: uvx --from zensical==0.0.50 zensical build --clean
      - name: Publish manifest channel alongside docs
        run: |
          install -d site/manifests
          cp manifests/channel.json site/manifest-channel.json
          cp manifests/monty-v*.json site/manifests/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
